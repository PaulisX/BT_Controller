<script src="index.js"></script>
<style>
	input[type="range"] {
		writing-mode: vertical-lr;
		direction: rtl;
		vertical-align: middle;
		height: auto;
		margin: 7%;
	}
</style>
<div
	class="slidecontainer"
	style="
		display: flex;
		justify-content: space-between;
		position: fixed;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
	"
>
	<input
		type="range"
		min="-127"
		max="127"
		step="1"
		value="0"
		class="slider"
		id="motA"
	/>
	<input
		type="range"
		min="-127"
		max="127"
		step="1"
		value="0"
		class="slider"
		id="motB"
	/>
</div>
<button
	type="button"
	onclick="connectToBluetoothDevice()"
	style="
		position: fixed;
		width: 20%;
		height: 20%;
		top: 50%;
		left: 50%;
		margin-top: -10%; /* Negative half of height. */
		margin-left: -10%; /* Negative half of width. */
	"
>
	CONN
</button>
